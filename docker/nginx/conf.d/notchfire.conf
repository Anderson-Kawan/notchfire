upstream notchfire_django {
    server django:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    access_log /var/log/nginx/notchfire-access.log;
    error_log /var/log/nginx/notchfire-error.log warn;

    location /healthz/ {
        proxy_pass http://notchfire_django/healthz/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /var/www/notchfire/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location /media/ {
        alias /var/www/notchfire/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://notchfire_django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }
}

# HTTPS futuro:
# 1. Termine TLS no CasaOS/reverse proxy externo apontando para este Nginx, ou
# 2. Monte certificados em /etc/nginx/certs e adicione um server listen 443 ssl.
# Quando usar HTTPS, ajuste o .env com SITE_URL=https://..., CSRF_TRUSTED_ORIGINS,
# DJANGO_SECURE_SSL_REDIRECT=True e cookies seguros.
